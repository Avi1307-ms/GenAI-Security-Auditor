
name: PR Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # Job 1: Basic PR information
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Say hello
        run: |
          echo "Hello from GenAI Security Auditor!"
          echo "Reviewing PR #${{ github.event.pull_request.number }}"

      - name: List changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD

  # Job 2: Trivy security scanning
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

  # Job 3: Python GenAI Security Auditor
  genai-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run audit script
        run: python src/audit.py ${{ github.base_ref }}
